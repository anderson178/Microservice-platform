spring:
  liquibase:
    enabled: true
    change-log: classpath:db/changelog/changelog-cumulative.yaml
    default-schema: payment
    contexts: test

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: payment

  kafka:
    consumer:
      auto-offset-reset: earliest
      enable-auto-commit: false
      group-id: payment-inquiry-group

app:
  outbox:
    batch-size: 2