services:
  payment-service:
    build:
      context: .
      dockerfile: payment-service/Dockerfile
    container_name: payment-service
    ports:
      - "8080:8080"
      - "8443:8443"
      - "8005:5005"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
    depends_on:
      payment-postgres:
        condition: service_healthy
    restart: unless-stopped

  payment-postgres:
    image: postgres:16-alpine
    container_name: payment-postgres
    environment:
      - POSTGRES_DB=payment
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
    volumes:
      - payment-postgres_data:/var/lib/postgresql/data
      - ./payment-service/init-db:/docker-entrypoint-initdb.d:ro
    ports:
      - "8432:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d payment" ]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  customer-service:
    build:
      context: .
      dockerfile: customer-service/Dockerfile
    container_name: customer-service
    ports:
      - "9080:8080"
      - "9443:8443"
      - "9005:5005"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
    depends_on:
      customer-postgres:
        condition: service_healthy
    restart: unless-stopped

  customer-postgres:
    image: postgres:16-alpine
    container_name: customer-postgres
    environment:
      - POSTGRES_DB=customer
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
    volumes:
      - customer-postgres_data:/var/lib/postgresql/data
      - ./customer-service/init-db:/docker-entrypoint-initdb.d:ro
    ports:
      - "9432:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d customer" ]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  inquiry-service:
    build:
      context: .
      dockerfile: inquiry-service/Dockerfile
    container_name: inquiry-service
    ports:
      - "7080:8080"
      - "7443:8443"
      - "7005:5005"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
    depends_on:
      inquiry-postgres:
        condition: service_healthy
    restart: unless-stopped

  inquiry-postgres:
    image: postgres:16-alpine
    container_name: inquiry-postgres
    environment:
      - POSTGRES_DB=inquiry
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
    volumes:
      - inquiry-postgres_data:/var/lib/postgresql/data
      - ./inquiry-service/init-db:/docker-entrypoint-initdb.d:ro
    ports:
      - "7432:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d inquiry" ]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  inventory-service:
    build:
      context: .
      dockerfile: inventory-service/Dockerfile
    container_name: inventory-service
    ports:
      - "6080:8080"
      - "6443:8443"
      - "6005:5005"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
    depends_on:
      inventory-postgres:
        condition: service_healthy
    restart: unless-stopped

  inventory-postgres:
    image: postgres:16-alpine
    container_name: inventory-postgres
    environment:
      - POSTGRES_DB=inventory
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
    volumes:
      - inventory-postgres_data:/var/lib/postgresql/data
      - ./inventory-service/init-db:/docker-entrypoint-initdb.d:ro
    ports:
      - "6432:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d inventory" ]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  kafka:
    image: apache/kafka:4.2.0
    container_name: kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 0
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '0@kafka:9093'
      KAFKA_LISTENERS: 'INTERNAL://:9091,EXTERNAL://:9092,CONTROLLER://:9093'
      KAFKA_ADVERTISED_LISTENERS: 'INTERNAL://kafka:9091,EXTERNAL://localhost:9092'
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      KAFKA_INTER_BROKER_LISTENER_NAME: 'INTERNAL'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    volumes:
      - kafka_data:/var/lib/kafka/data
      - ./init-kafka.sh:/opt/kafka/init-kafka.sh
    entrypoint: [ "/bin/sh" ]
    command: [ "-c", "chmod +x /opt/kafka/init-kafka.sh && /opt/kafka/init-kafka.sh" ]

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    ports:
      - "9093:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9091
    depends_on:
      - kafka

  keycloak:
    image: quay.io/keycloak/keycloak:23.0
    command: [ "start-dev", "--import-realm" ]
    environment:
      - KEYCLOAK_ADMIN=${KEYCLOAK_ADMIN}
      - KEYCLOAK_ADMIN_PASSWORD=${KEYCLOAK_ADMIN_PASSWORD}
      - KC_HOSTNAME_STRICT=false
      - KC_HTTP_ENABLED=true
      - KC_HEALTH_ENABLED=true
    ports:
      - "8082:8080"
    volumes:
      - ./keycloak:/opt/keycloak/data/import:ro
      - keycloak_data:/opt/keycloak/data
    healthcheck:
      test: [ "CMD-SHELL", "exec 3<>/dev/tcp/localhost/8080; echo -e 'GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3; cat <&3 | grep -q '200 OK'" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

volumes:
  payment-postgres_data:
  customer-postgres_data:
  inquiry-postgres_data:
  inventory-postgres_data:
  keycloak_data:
  kafka_data:
