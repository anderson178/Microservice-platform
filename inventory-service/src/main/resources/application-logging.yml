management:
  tracing:
    sampling:
      probability: 1.0
  metrics:
    export:
      logging:
        step: 1 #minutes

logging:
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSS} %-5level [${spring.application.name}] [%X{traceId:-}] %msg [%thread, %logger{0}]%n"

  level:
    root: INFO
    org.springframework: INFO
    org.hibernate: WARN
    com.iprody: INFO
    org.springframework.web: DEBUG
    org.springframework.web.filter.CommonsRequestLoggingFilter: DEBUG
