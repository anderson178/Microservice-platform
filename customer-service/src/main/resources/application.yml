spring:
  application:
    name: customer-service
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
        default_schema: customer

  liquibase:
    enabled: true
    change-log: db/changelog-cumulative.yaml
    default-schema: customer
    contexts: development

management:
  endpoints:
    web:
      exposure:
        include: "health,metrics,prometheus"
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
      group:
        readiness:
          include: "readinessState,db,keycloak"
