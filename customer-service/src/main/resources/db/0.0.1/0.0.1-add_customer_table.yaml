databaseChangeLog:
  - changeSet:
      id: 0.0.1 - add table 'CUSTOMER'
      author: mironenko
      changes:
        - createTable:
            tableName: CUSTOMER
            columns:
              - column:
                  name: id
                  type: UUID
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: FULL_NAME
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: CONTRACT_DETAILS_IS
                  type: UUID
                  constraints:
                    nullable: false
                    unique: true
                    foreignKeyName: fk_customer_contract
                    referencedTableName: CONTRACT
                    referencedColumnNames: id
              - column:
                  name: CREATED_AT
                  type: TIMESTAMP
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: UPDATED_AT
                  type: TIMESTAMP
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
      rollback:
        - dropTable:
            tableName: CUSTOMER