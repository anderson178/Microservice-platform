databaseChangeLog:
  - changeSet:
      id: 0.0.1 - add table 'CONTRACT'
      author: mironenko
      changes:
        - createTable:
            tableName: CONTRACT
            columns:
              - column:
                  name: id
                  type: UUID
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: EMAIL
                  type: VARCHAR(50)
                  constraints:
                    nullable: false
              - column:
                  name: PHONE_NUMBER
                  type: VARCHAR(50)
                  constraints:
                    nullable: false
              - column:
                  name: CREATED_AT
                  type: TIMESTAMP
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: UPDATED_AT
                  type: TIMESTAMP
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
      rollback:
        - dropTable:
            tableName: CONTRACT